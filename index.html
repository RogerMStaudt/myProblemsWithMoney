<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>RogerStaudt's dinasty</title>
</head>
<body>
    <div class="title-region">
        <h1>Find a way to feed your kids...</h1>
    </div>

    <form method="post" id="expenses-form">
        <div class="fields-region">
            <div class="field-item">
                <label for="expense">Expense:</label>
                <input type="text" name="expense" id="expense" required>
            </div>
            
            <div class="field-item">
                <label for="value">Value:</label>
                <input type="text" name="value" id="value" required>
            </div>
            
            <div class="field-item">
                <label for="date">Date:</label>
                <input type="date" name="date" id="date">
            </div>
            
            <div class="field-item">
                <label for="category">Category:</label>
                
                <select name="category" id="category-select">
                    <option value="">--Please choose an option--</option>
                    <option value="food">Food</option>
                    <option value="transportation">Transportation</option>
                    <option value="utilities">Utilities</option>
                    <option value="internet">Internet</option>
                </select>
            </div>
        </div>
        
        <div class="buttons-region">
            <input type="submit" value="Add Expense">
        </div>
    </form>

    <script src="/src/expenses.js"></script>
</body>
</html>
